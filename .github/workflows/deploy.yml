name: テストしてデプロイする

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ray（desk）のテスト
        working-directory: desk
        run: |
          git config --global user.name test
          git config --global user.email test@example.com
          python3 -m unittest discover -s tests -t . -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare の設定が無ければとばす
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN が未設定なのでデプロイをとばしました（README の手順を参照）"
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub の Secrets に入っているものだけ Cloudflare に送る（入っていないものは Cloudflare 側の値をそのまま使う）
      - name: 秘密の値を Cloudflare に送る
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_GITHUB_TOKEN: ${{ secrets.CMD_TOKEN }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S_ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: |
          for name in GITHUB_TOKEN OPENAI_API_KEY ACCESS_KEY; do
            var="S_$name"
            if [ -n "${!var}" ]; then
              printf '%s' "${!var}" | npx --yes wrangler@3 secret put "$name"
            else
              echo "::notice::$name は GitHub の Secrets にないので、Cloudflare に入っている値をそのまま使います"
            fi
          done
