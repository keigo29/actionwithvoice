# config.toml にコピーして使う（config.toml は Git に入れない）

cmd_dir = "~/Cmd"            # Cmd のローカルクローン
hotkey = "alt_r"             # 押している間だけ聞く（右 Option）。f13 や "§" なども可
conversation_timeout = 300   # この秒数以内なら前の話の続き

[stt]
engine = "auto"              # auto / mlx / whisper_cpp
mlx_model = "mlx-community/whisper-large-v3-turbo"
whisper_cpp_bin = "whisper-cli"
whisper_cpp_model = "~/models/ggml-medium.bin"

[tts]
voice = "Kyoko"              # say -v '?' で一覧。システム設定で「Kyoko（拡張）」を入れると自然になる
rate = 210

[claude]
bin = "claude"
model = "sonnet"             # 返事の速さ優先。空なら Claude Code の既定（Opus。2倍ほど遅い）
effort = "low"               # 考える量。low / medium / high。空なら既定
mcp = false                  # true で MCP（Discord・Google Drive など）も読み込む。起動が1秒ほど遅くなる
timeout = 180

[local]
enabled = true               # 一次受けをローカル LLM（Ollama）にする。false で Claude だけ
model = "qwen2.5:7b"
keep_alive = -1              # -1 は Ray が動いている間ずっとメモリに載せる（約 9.5GB。Ray を止めると外す）。"1h" などにもできる
timeout = 8                  # この秒数、返事がなければ Claude に回す

[rewrite]
# Claude に回す前に、ローカル LLM が長い発話・長い履歴を短い依頼に変換する（Mac の外には出さない）
# 既定は ray/rewrite.py の定数。変えたいものだけ書く
enabled = true
min_chars = 60               # 発話がこの字数以上なら変換する
min_history_turns = 4        # 同じ会話のやり取りがこの数以上なら、履歴を要約して Claude のセッションを新しく始める
min_history_chars = 1200     # または、やり取りの字数の合計がこれ以上なら
timeout = 10                 # この秒数で変換が終わらなければ、原文のまま Claude へ
fresh_session = true         # 履歴を要約したら --resume せずに始める（履歴とファイルの読み直しを減らす）
templates = true             # やることの追加・記録・予定の確認は、テンプレで依頼にする（7B を呼ばない）
templates_on_short = true    # テンプレは短い質問にも使う

[gemini]
enabled = true               # Gemini の無料枠（有料枠は使わない）。鍵が無ければ、この段は飛ばして Claude
api_key = ""                 # AI Studio で、課金を設定していないプロジェクトの鍵。環境変数 GEMINI_API_KEY でもよい
model = "gemini-flash-lite-latest"
search = true                # 調べものも Google 検索つきで Gemini に任せる
daily_limit = 450            # 無料枠（1日500回）より少し手前で止める

[search]
enabled = true               # 調べものは検索 API（Tavily）で取り、Gemini 無料枠で要約する（だめなら Claude）
api_key = ""                 # Tavily の鍵。環境変数 TAVILY_API_KEY でもよい（config.toml は Git に入らない）
near = ""                    # 「近く」と言ったときの場所（例 "上星川駅"）。空なら [weather] place。検索の言葉として外に出る
monthly_limit = 950          # 無料枠（月1,000クレジット）より少し手前で止める

[wake]
enabled = false
model = ""                   # openWakeWord のモデル（例 ~/models/ray.onnx）
threshold = 0.5
silence_sec = 1.2
max_sec = 15

[ui]
enabled = true
port = 8765
open_browser = true

[weather]
place = "横浜"               # 画面に出す天気の場所
latitude = 35.44
longitude = 139.64

[log]
enabled = true               # Cmd の Data/ray/ に Q&A を置く（デイリーには入らない）
push = true                  # 置いたら push する

[sfx]
enabled = true               # 起動・画面を開く／閉じる・聞き取り開始・聞き取れたときの効果音
volume = 0.5                 # 0〜1
pitch = 0.5                  # 音の高さ。1 で元の高さ、0.5 で1オクターブ下。小さいほど低い
